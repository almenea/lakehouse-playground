# ---------------------------------------------------------
# Iceberg Connector → Apache Polaris REST Catalog
# ---------------------------------------------------------
connector.name=iceberg
iceberg.catalog.type=rest

# --- Polaris REST Catalog ---
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse

# --- Polaris OAuth2 Authentication ---
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.vended-credentials-enabled=false

# --- S3 File System (SeaweedFS) ---
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}

# --- Iceberg Settings ---
iceberg.file-format=PARQUET
iceberg.add-files-procedure.enabled=true
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
iceberg.rest-catalog.nested-namespace-enabled=true
iceberg.allowed-extra-properties=*